<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dent-Z Payment Slip Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h2 {
            color: #166534;
            margin-top: 0;
        }
        .loading {
            color: #6b7280;
            font-style: italic;
        }
        .error {
            color: #dc2626;
            background: #fee2e2;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        .slip-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: none;
        }
        .back-btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: #166534;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #14532d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>หลักฐานการชำระเงิน</h2>
    
    <div id="loading" class="loading">กำลังโหลดภาพสลิป...</div>
    <div id="error" class="error">ไม่พบข้อมูลสลิป หรือสลิปนี้ถูกลบไปแล้ว</div>
    
    <img id="slip-image" class="slip-image" alt="Payment Slip">
    
    <a href="/" class="back-btn">กลับสู่หน้าหลัก</a>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const imageEl = document.getElementById('slip-image');
        
        if (!id) {
            loadingEl.style.display = 'none';
            errorEl.textContent = 'ไม่พบรหัสอ้างอิงสลิปใน URL';
            errorEl.style.display = 'block';
            return;
        }
        
        const PROJECT_ID = 'dent-z-app';
        const API_KEY = 'AIzaSyAsrBWUkmqQM-ueNCk0xAaIc0jIPrR7e_w';
        const url = \`https://firestore.googleapis.com/v1/projects/\${PROJECT_ID}/databases/(default)/documents/orders/\${id}?key=\${API_KEY}\`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('Document not found');
            }
            
            const data = await response.json();
            
            if (data.fields && data.fields.slip_image_base64 && data.fields.slip_image_base64.stringValue) {
                imageEl.src = data.fields.slip_image_base64.stringValue;
                imageEl.style.display = 'block';
                loadingEl.style.display = 'none';
            } else {
                throw new Error('No image data in document');
            }
            
        } catch (err) {
            console.error('Error fetching slip:', err);
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
        }
    });
</script>

</body>
</html>
